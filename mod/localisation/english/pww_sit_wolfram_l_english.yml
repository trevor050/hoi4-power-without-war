l_english:
 pww_sit_wolfram_title:0 "The Wolfram Question"
 pww_sit_wolfram_subtitle:0 "Portuguese Tungsten Allocation"
 pww_sit_wolfram_prize:0 "Prize: [pww_holder.GetAdjective] tungsten output (Guarda and Lisbon)"
 pww_sit_wolfram_desc_claimant:0 "Fighting in China has severed our Asian wolfram supply. Without Iberian tungsten, armor-piercing shell and tool-steel output will stall. Salazar is cautious, proud, and bound to London by a five-hundred-year alliance. Secure the mines by clearing credit, quiet pressure, or open force before the decision date."
 pww_sit_wolfram_desc_holder:0 "Berlin is hungry for our wolfram and London is determined to deny it to them. Both powers have sent trade delegations to Lisbon. Yield outright to Germany and Britain may cut our Atlantic lifeline; defy Berlin carelessly and German cruisers may appear off the Tagus. Split the lots, play both capitals, or extract a real price for our ore."
 pww_sit_wolfram_desc_patron:0 "German agents are pressing Lisbon for exclusive rights to Portuguese wolfram, vital to the Wehrmacht's high-velocity shells. Our oldest ally cannot hold out on sentiment alone. Underwrite Salazar's unsold output with a commercial pledge, bid for the mines directly, or let Berlin tighten its grip on Iberia."
 pww_sit_wolfram_desc_observer:0 "Berlin and London are competing for control of Portugal's tungsten output while Lisbon seeks to preserve its neutrality and profit from both."
 pww_sit_wolfram_open_ger:0 "Chinese wolfram shipments have dried up. The Ministry of Economics has turned its eyes to Portugal."
 pww_sit_wolfram_open_por:0 "German and British envoys have both requested urgent audiences on wolfram export allocations."
 pww_sit_wolfram_open_eng:0 "German clearing agents are moving on Portuguese wolfram. Lisbon is looking to London."
 pww_res_wolfram_split_title:0 "The Wolfram Accord: Output Divided"
 pww_res_wolfram_split_desc:0 "After weeks of quiet bargaining in Lisbon, Salazar has divided Portugal's tungsten output between the two rival capitals. Guarda's interior ore moves under one contract while Lisbon's coastal allocation answers to the other. Neither Berlin nor London secured a monopoly, and Portugal has turned great-power hunger into a steady stream of factories and arms without breaking its neutrality."
 pww_res_wolfram_split_opt_ger:0 "Half the ore is better than idle shell plants."
 pww_res_wolfram_split_opt_por:0 "Both giants pay; Lisbon answers to neither."
 pww_res_wolfram_split_opt_eng:0 "Berlin did not get the whole field."
 pww_res_wolfram_ger_title:0 "German Concessions in Beira Baixa"
 pww_res_wolfram_ger_desc:0 "Portugal has granted Germany a timed lease over its principal wolfram districts. German engineers are already inspecting rail sidings toward the Spanish frontier, and clearing credits have begun flowing into Lisbon's accounts. In Whitehall, the Foreign Office views the signature as a sharp blow to the Anglo-Portuguese alliance."
 pww_res_wolfram_ger_opt_ger:0 "The shell plants will not want for tungsten."
 pww_res_wolfram_ger_opt_por:0 "We took the terms we could live with."
 pww_res_wolfram_ger_opt_eng:0 "A bitter setback on the Tagus."
 pww_res_wolfram_eng_title:0 "London Secures the Portuguese Mines"
 pww_res_wolfram_eng_desc:0 "Backed by British underwriting and the weight of the 1386 alliance, Lisbon has placed its wolfram output under British lease. Ships clearing the Tagus now carry ore bound strictly for British foundries, leaving German procurement offices scrambling for substitutes and eyeing alternate routes across Iberia."
 pww_res_wolfram_eng_opt_ger:0 "We will find another way into Iberia."
 pww_res_wolfram_eng_opt_por:0 "Our oldest ally paid its way."
 pww_res_wolfram_eng_opt_eng:0 "Denial without a shot fired."
 pww_res_wolfram_por_title:0 "Lisbon Keeps Its Mines"
 pww_res_wolfram_por_desc:0 "The decision date has passed with no foreign flag over Guarda or Lisbon. Whether by stalling the delegations, playing rival bids off against one another, or leaning on commercial pledges, Salazar has kept Portuguese tungsten in Portuguese hands. Foreign buyers will pay open terms on Lisbon's schedule, or go without."
 pww_res_wolfram_por_opt_ger:0 "Salazar outlasted us this round."
 pww_res_wolfram_por_opt_por:0 "Portugal is not for sale."
 pww_res_wolfram_por_opt_eng:0 "Neutrality held firm."
 pww_res_wolfram_war_title:0 "The Wolfram Crisis Breaks Into War"
 pww_res_wolfram_war_desc:0 "Cornered beyond endurance and left with no exit it could sign, diplomacy has collapsed into open hostilities. Trade delegations have been recalled, ports are sealed, and what began as a dispute over tungsten tonnage will now be settled by arms."
 pww_res_wolfram_war_opt_all:0 "So ends the peace."
 pww_renew_wolfram_alert:0 "Portuguese wolfram lease expires in [?pww_days_left] days."
 pww_renew_wolfram_title:0 "Renewal of the Portuguese Wolfram Lease"
 pww_renew_wolfram_desc_holder:0 "The one-year concession granted to [pww_lessee.GetName] is coming due. Lisbon may renew on current terms, demand a richer bundle, open a fresh auction to rival bidders, or let the rights revert to Portuguese hands."
 pww_renew_wolfram_desc_lessee:0 "Our tungsten lease in [pww_holder.GetName] is due to expire. Rival envoys are already calling at the Portuguese foreign ministry; renew promptly or risk losing the mines."
 pww_renew_wolfram_desc_rival:0 "[pww_lessee.GetAdjective] rights in Portugal are nearing expiry. This is our opening to outbid them before Lisbon signs another term."
 pww_renew_btn_extend:0 "Renew on Current Terms"
 pww_renew_btn_rebid:0 "Open Fresh Auction"
 pww_renew_btn_reclaim:0 "Let Lease Revert"
 pww_renew_btn_outbid:0 "Submit Rival Bid"
