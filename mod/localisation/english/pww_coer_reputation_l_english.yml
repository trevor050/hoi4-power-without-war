l_english:
 pww_rep_rel_band_4:0 "§GWord as Good as Gold§!"
 pww_rep_rel_band_3:0 "Dependable"
 pww_rep_rel_band_2:0 "§YCautiously Watched§!"
 pww_rep_rel_band_1:0 "§OSuspect§!"
 pww_rep_rel_band_0:0 "§RUntrusted§!"
 pww_rep_rel_4_a:0 "\"[ROOT.GetCapitalName] pays on the day it promises,\" notes the [FROM.GetAdjective] trade ministry."
 pww_rep_rel_4_b:0 "Merchants in [FROM.GetCapitalName] treat a [ROOT.GetAdjective] signature as settled coin."
 pww_rep_rel_4_c:0 "[FROM.GetName] accepts [ROOT.GetAdjective] clearing paper without asking for collateral."
 pww_rep_rel_3_a:0 "[FROM.GetCapitalName] regards [ROOT.GetName] as a steady partner so long as terms are clear."
 pww_rep_rel_3_b:0 "Envoys in [FROM.GetCapitalName] expect [ROOT.GetName] to honor ordinary commercial schedules."
 pww_rep_rel_3_c:0 "[FROM.GetAdjective] officials raise no special objection to long-term [ROOT.GetAdjective] contracts."
 pww_rep_rel_2_a:0 "[FROM.GetCapitalName] checks every annex twice before signing with [ROOT.GetName]."
 pww_rep_rel_2_b:0 "\"[ROOT.GetName] keeps the easy clauses,\" mutters the [FROM.GetAdjective] legation, \"and revises the hard ones.\""
 pww_rep_rel_2_c:0 "[FROM.GetAdjective] ministers prefer staged tranches when dealing with [ROOT.GetCapitalName]."
 pww_rep_rel_1_a:0 "[FROM.GetCapitalName] doubts [ROOT.GetName] will still honor the ledger next winter."
 pww_rep_rel_1_b:0 "\"Do not hand [ROOT.GetName] anything you cannot take back,\" advises the [FROM.GetAdjective] foreign office."
 pww_rep_rel_1_c:0 "Recent defaults by [ROOT.GetName] have chilled commercial talks across [FROM.GetCapitalName]."
 pww_rep_rel_0_a:0 "No cabinet in [FROM.GetCapitalName] will stake its industry on a [ROOT.GetAdjective] promise."
 pww_rep_rel_0_b:0 "\"[ROOT.GetName] signs treaties to buy time, not to keep them,\" reads the [FROM.GetAdjective] brief."
 pww_rep_rel_0_c:0 "Only cash-on-delivery or force will extract a signature from [FROM.GetName] now."
 pww_rep_cred_band_4:0 "§GFeared§!"
 pww_rep_cred_band_3:0 "Taken Seriously"
 pww_rep_cred_band_2:0 "Untested"
 pww_rep_cred_band_1:0 "§ODoubted§!"
 pww_rep_cred_band_0:0 "§RHollow§!"
 pww_rep_cred_4_a:0 "\"When [ROOT.GetCapitalName] sets a date, the ships are already coaling,\" warns the [FROM.GetAdjective] attaché."
 pww_rep_cred_4_b:0 "[FROM.GetCapitalName] treats even a quiet [ROOT.GetAdjective] warning as a loaded gun."
 pww_rep_cred_4_c:0 "No minister in [FROM.GetName] expects [ROOT.GetName] to blink first."
 pww_rep_cred_3_a:0 "[FROM.GetCapitalName] assumes [ROOT.GetName] will enforce any deadline it puts in writing."
 pww_rep_cred_3_b:0 "Recent demonstrations proved [ROOT.GetName] is willing to pay the cost of pressure."
 pww_rep_cred_3_c:0 "The [FROM.GetAdjective] cabinet weighs [ROOT.GetAdjective] notes with genuine caution."
 pww_rep_cred_2_a:0 "[FROM.GetCapitalName] has yet to see whether [ROOT.GetName] backs its cables with steel."
 pww_rep_cred_2_b:0 "\"They speak firmly, but we have not tested their nerve,\" reports the [FROM.GetAdjective] chancery."
 pww_rep_cred_2_c:0 "[FROM.GetName] is still taking the measure of [ROOT.GetAdjective] resolve."
 pww_rep_cred_1_a:0 "[FROM.GetCapitalName] doubts [ROOT.GetName] would really enforce an embargo."
 pww_rep_cred_1_b:0 "\"Wait out the deadline and [ROOT.GetCapitalName] will find a pretext to move on,\" says the [FROM.GetAdjective] envoy."
 pww_rep_cred_1_c:0 "Unpunished refusals have left [FROM.GetName] skeptical of [ROOT.GetAdjective] ultimatums."
 pww_rep_cred_0_a:0 "[FROM.GetCapitalName] files [ROOT.GetAdjective] ultimatums with the morning newspapers."
 pww_rep_cred_0_b:0 "\"Paper threats from [ROOT.GetCapitalName],\" remarks the [FROM.GetAdjective] prime minister. \"Let them shout.\""
 pww_rep_cred_0_c:0 "After repeated climb-downs, nobody in [FROM.GetName] expects [ROOT.GetName] to act."
 pww_rep_alarm_band_0:0 "Quiet"
 pww_rep_alarm_band_1:0 "Watched"
 pww_rep_alarm_band_2:0 "§YUneasy§!"
 pww_rep_alarm_band_3:0 "§OAlarmed§!"
 pww_rep_alarm_band_4:0 "§RClosing Ranks§!"
 pww_rep_alarm_0_a:0 "Capitals near [FROM.GetName] treat [ROOT.GetAdjective] commerce as routine business."
 pww_rep_alarm_0_b:0 "No chancery in the region sees [ROOT.GetName] as a predator."
 pww_rep_alarm_1_a:0 "Neighboring ministries have begun tracking [ROOT.GetAdjective] trade delegations closely."
 pww_rep_alarm_1_b:0 "[FROM.GetCapitalName] notes a sharper edge to [ROOT.GetAdjective] diplomacy of late."
 pww_rep_alarm_2_a:0 "Smaller powers around [FROM.GetName] are quietly asking majors for commercial cover against [ROOT.GetName]."
 pww_rep_alarm_2_b:0 "\"First one mine, then the next,\" warns a circular from [FROM.GetCapitalName]."
 pww_rep_alarm_3_a:0 "Regional powers view [ROOT.GetName]'s coercion as a direct threat to their sphere."
 pww_rep_alarm_3_b:0 "Guarantees and counter-pledges are being drafted across the region to blunt [ROOT.GetCapitalName]."
 pww_rep_alarm_4_a:0 "Every major with a stake near [FROM.GetName] is prepared to step in against [ROOT.GetName]."
 pww_rep_alarm_4_b:0 "\"[ROOT.GetName] will not take another concession here without answering to us,\" cables [FROM.GetCapitalName]."
 pww_rep_combo_feared_untrusted:0 "[FROM.GetCapitalName] fears [ROOT.GetAdjective] retaliation, but expects [ROOT.GetName] to break any promise the moment it suits them."
 pww_rep_combo_honest_soft:0 "[FROM.GetName] trusts [ROOT.GetAdjective] contracts and ignores [ROOT.GetAdjective] threats."
 pww_rep_combo_iron_bond:0 "[FROM.GetCapitalName] knows [ROOT.GetName] keeps both its bargains and its warnings."
 pww_rep_combo_spent:0 "Neither [ROOT.GetAdjective] promises nor [ROOT.GetAdjective] threats carry weight in [FROM.GetCapitalName]."
 pww_dep_voice_they_buyer:0 "[FROM.GetAdjective] exporters lean heavily on [ROOT.GetAdjective] orders."
 pww_dep_voice_they_supplier:0 "[FROM.GetAdjective] plants would slow sharply if [ROOT.GetName] cut deliveries."
 pww_dep_voice_we_supplier:0 "Our own mills are exposed if [FROM.GetCapitalName] halts shipments."
 pww_dep_voice_we_buyer:0 "Our surplus depends on [FROM.GetAdjective] demand staying open."
 pww_dep_voice_mutual:0 "Both [ROOT.GetCapitalName] and [FROM.GetCapitalName] would bleed if trade broke off."
 pww_dep_voice_clearing:0 "Unredeemed clearing balances tie [FROM.GetName] to [ROOT.GetAdjective] arms deliveries."
 pww_dep_voice_clearing_grievance:0 "[FROM.GetCapitalName] is furious over clearing credits it can no longer redeem in [ROOT.GetAdjective] arms."
