l_english:
 pww_cartel_category: "Producers' Agreements"
 pww_cartel_category_desc: "Where too many mines and plantations chase too few buyers, producers can agree to sell less and hold the price. Members keep their surplus off the market. Those who break ranks risk being found out."
 pww_cartel_call_aluminium_tt: "Costs 25 political power.\nEvery country with aluminium it cannot sell is invited to a conference that sits in 30 days. If at least two producers sign, the agreement takes effect with us in the chair.\nEach member may then sell, through its own contracts, no more than its quota (its present contracts plus [?global.pww_cartel_c_quota_pct|0]% of its unsold aluminium), and none below the agreed price: 10% above the open market, at most 7.2 aluminium per civilian factory instead of 8. Members stop undercutting one another, so what we sell fetches more.\nIf fewer than two sign, the conference fails and no aluminium conference can meet for six months."
 pww_cartel_join_aluminium_tt: "Costs 10 political power.\nWe sign the Aluminium Agreement. Our quota is our present aluminium contracts plus [?global.pww_cart_qpct_res^1|0]% of our unsold aluminium; the rest is kept off the market (in our reserve if we keep one, otherwise left unextracted). Our contracts may not go below the agreed price: at most [?global.pww_cart_upf_res^1|1] aluminium per civilian factory.\nIn return the other members stop competing with us for buyers, so our sales fetch more. Selling beyond the quota or under the price risks a warning, then expulsion."
 pww_cartel_leave_aluminium_tt: "Costs nothing.\nOur quota ends and we may sell aluminium to anyone at any price. The agreement loses 15 cohesion (10 more if we chair it); it stands at [?global.pww_cart_coh_res^1|0]. If its cohesion falls below [?global.pww_cartel_c_collapse|0], or fewer than two members remain, the agreement breaks up: a price war follows and aluminium is cheap for everyone for six months."
 pww_cartel_press_aluminium_tt: "Costs 15 political power. We can lean on one member every 90 days.\n[FROM.GetNameDef] will think less of us and grow more tempted to sell aluminium outside its quota and below the agreed price, to us as well. The agreement loses 5 cohesion; it stands at [?global.pww_cart_coh_res^1|0]. If its cohesion falls below [?global.pww_cartel_c_collapse|0], or fewer than two members remain, the agreement breaks up: a price war follows and aluminium is cheap for everyone for six months."
 pww_cartel_flood_aluminium_tt: "Costs 50 political power.\nFor four months the Aluminium Agreement loses 6 cohesion a month (it stands at [?global.pww_cart_coh_res^1|0]) and every member grows more tempted to sell outside its quota. The members will resent us. If its cohesion falls below [?global.pww_cartel_c_collapse|0], or fewer than two members remain, the agreement breaks up: a price war follows and aluminium is cheap for everyone for six months."
 pww_cartel_poach_aluminium_afford: "At least [?FROM.pww_cartel_ct_civ_aluminium|0] civilian factories free for new projects. Factories building now count: the contract takes them off construction, as any trade does."
 pww_cartel_poach_aluminium_tt: "Costs 25 political power. If they sign, it also costs [?FROM.pww_cartel_ct_civ_aluminium|0] civilian factories for a year.\nOur offer to [FROM.GetNameDef]: [?FROM.pww_cartel_ct_amt_aluminium|0] aluminium a day for [?FROM.pww_cartel_ct_civ_aluminium|0] civilian factories, a fixed contract for one year that neither side may end early. That is [?FROM.pww_cartel_ct_upf_aluminium|1] aluminium per factory, against 8 on the open market and [?FROM.pww_cartel_ct_cupf_aluminium|1] under the agreement."
 pww_cartel_poach_aluminium_tt2: "If they sign, they leave the agreement, which loses 25 cohesion (it stands at [?global.pww_cart_coh_res^1|0]), and the remaining members resent us. If its cohesion falls below [?global.pww_cartel_c_collapse|0], or fewer than two members remain, the agreement breaks up: a price war follows and aluminium is cheap for everyone for six months."
 pww_cartel_poach_aluminium_tt3: "If they refuse, they stay in, but they grow more tempted to sell outside it and the agreement loses 3 cohesion. Whether they sign depends on how much aluminium they cannot sell, how firm the agreement is, and how they regard us."
 pww_cartel_call_aluminium: "Call an Aluminium Producers' Conference"
 pww_cartel_call_aluminium_desc: "Our aluminium piles up unsold, and so does everyone else's. Let the producers meet and agree to restrict exports before the price falls further."
 pww_cartel_join_aluminium: "Join the Aluminium Agreement"
 pww_cartel_join_aluminium_desc: "The aluminium producers have an agreement. Signing it means a quota and a better price for what we do sell."
 pww_cartel_leave_aluminium: "Leave the Aluminium Agreement"
 pww_cartel_leave_aluminium_desc: "The quota costs us sales we could make. We can sell freely outside it."
 pww_cartel_poach_aluminium: "Court an Aluminium Producer"
 pww_cartel_poach_aluminium_desc: "Offer [FROM.GetNameDef] a better contract than the agreement allows, on condition that it leaves."
 pww_cartel_press_aluminium: "Lean on an Aluminium Producer"
 pww_cartel_press_aluminium_desc: "We are a large buyer of aluminium. [FROM.GetNameDef] should remember it."
 pww_cartel_flood_aluminium: "Flood the Aluminium Market"
 pww_cartel_flood_aluminium_desc: "Sell our aluminium at whatever the market will bear and let the agreement's members watch their customers go."
