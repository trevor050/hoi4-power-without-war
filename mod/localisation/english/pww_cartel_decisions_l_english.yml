 pww_cartel_leave_coal_tt: "Costs nothing.\nOur quota ends and we may sell coal to anyone at any price. The agreement loses 15 cohesion (10 more if we chair it); it stands at [?global.pww_cart_coh_res^6|0]. If its cohesion falls below [?global.pww_cartel_c_collapse|0], or fewer than two members remain, the agreement breaks up: a price war follows and coal is cheap for everyone for six months."
 pww_cartel_press_coal_tt: "Costs 15 political power. We can lean on one member every 90 days.\n[FROM.GetNameDef] will think less of us and grow more tempted to sell coal outside its quota and below the agreed price, to us as well. The agreement loses 5 cohesion; it stands at [?global.pww_cart_coh_res^6|0]. If its cohesion falls below [?global.pww_cartel_c_collapse|0], or fewer than two members remain, the agreement breaks up: a price war follows and coal is cheap for everyone for six months."
 pww_cartel_flood_coal_tt: "Costs 50 political power.\nFor four months the Coal Agreement loses 6 cohesion a month (it stands at [?global.pww_cart_coh_res^6|0]) and every member grows more tempted to sell outside its quota. The members will resent us. If its cohesion falls below [?global.pww_cartel_c_collapse|0], or fewer than two members remain, the agreement breaks up: a price war follows and coal is cheap for everyone for six months."
 pww_cartel_poach_coal_afford: "At least [?FROM.pww_cartel_ct_civ_coal|0] civilian factories free for new projects. Factories building now count: the contract takes them off construction, as any trade does."
 pww_cartel_poach_coal_tt: "Costs 25 political power. If they sign, it also costs [?FROM.pww_cartel_ct_civ_coal|0] civilian factories for a year.\nOur offer to [FROM.GetNameDef]: [?FROM.pww_cartel_ct_amt_coal|0] coal a day for [?FROM.pww_cartel_ct_civ_coal|0] civilian factories, a fixed contract for one year that neither side may end early. That is [?FROM.pww_cartel_ct_upf_coal|1] coal per factory, against 8 on the open market and [?FROM.pww_cartel_ct_cupf_coal|1] under the agreement."
 pww_cartel_poach_coal_tt2: "If they sign, they leave the agreement, which loses 25 cohesion (it stands at [?global.pww_cart_coh_res^6|0]), and the remaining members resent us. If its cohesion falls below [?global.pww_cartel_c_collapse|0], or fewer than two members remain, the agreement breaks up: a price war follows and coal is cheap for everyone for six months."
 pww_cartel_poach_coal_tt3: "If they refuse, they stay in, but they grow more tempted to sell outside it and the agreement loses 3 cohesion. Whether they sign depends on how much coal they cannot sell, how firm the agreement is, and how they regard us."
 pww_cartel_call_coal: "Call a Coal Producers' Conference"
 pww_cartel_call_coal_desc: "Our coal piles up unsold, and so does everyone else's. Let the producers meet and agree to restrict exports before the price falls further."
 pww_cartel_join_coal: "Join the Coal Agreement"
 pww_cartel_join_coal_desc: "The coal producers have an agreement. Signing it means a quota and a better price for what we do sell."
 pww_cartel_leave_coal: "Leave the Coal Agreement"
 pww_cartel_leave_coal_desc: "The quota costs us sales we could make. We can sell freely outside it."
 pww_cartel_poach_coal: "Court a Coal Producer"
 pww_cartel_poach_coal_desc: "Offer [FROM.GetNameDef] a better contract than the agreement allows, on condition that it leaves."
 pww_cartel_press_coal: "Lean on a Coal Producer"
 pww_cartel_press_coal_desc: "We are a large buyer of coal. [FROM.GetNameDef] should remember it."
 pww_cartel_flood_coal: "Flood the Coal Market"
 pww_cartel_flood_coal_desc: "Sell our coal at whatever the market will bear and let the agreement's members watch their customers go."
