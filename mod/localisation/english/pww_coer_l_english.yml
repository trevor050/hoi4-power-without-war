l_english:
 pww_coer_ev_channel_0:0 "Through a private channel, [FROM.GetName] presses a demand on us."
 pww_coer_ev_channel_1:0 "[FROM.GetName] has delivered a public ultimatum."
 pww_coer_ev_what_0:0 "It wants a share of our [pww_coer_ev_res_text] output under a fixed-term agreement."
 pww_coer_ev_what_1:0 "It wants a lease on the [pww_coer_ev_res_text] of one of our producing states."
 pww_coer_ev_what_2:0 "It wants us to cut off our trade with a third power."
 pww_coer_res_0:0 "oil"
 pww_coer_res_1:0 "aluminium"
 pww_coer_res_2:0 "rubber"
 pww_coer_res_3:0 "tungsten"
 pww_coer_res_4:0 "steel"
 pww_coer_res_5:0 "chromium"
 pww_coer_res_6:0 "coal"
 pww_coer_res_all:0 "resources"
 pww_coer.1.t:0 "A Demand from [FROM.GetName]"
 pww_coer.1.d:0 "[pww_coer_ev_channel_text] [pww_coer_ev_what_text]\n\nWe may yield, offer less, buy time, look for a protector, or stand firm. Refusing is not war, but [FROM.GetCapitalName] will remember it."
 pww_coer.1.a:0 "We yield."
 pww_coer.1.b:0 "Offer a smaller lot."
 pww_coer.1.c:0 "Accept a provisional arrangement for ninety days."
 pww_coer.1.e:0 "Appeal to a patron."
 pww_coer.1.f:0 "Call up the reserves and stand firm."
 pww_coer.1.g:0 "Drag out the talks."
 pww_coer.1.h:0 "We will weigh our answer."
 pww_coer.2.t:0 "[FROM.GetName] Counters"
 pww_coer.2.d_lot:0 "[FROM.GetCapitalName] offers a smaller lot than we asked for. Taking it closes the matter now."
 pww_coer.2.d_fig:0 "[FROM.GetCapitalName] will yield, but only under its own face-saving wording."
 pww_coer.2.a:0 "Accept."
 pww_coer.2.b:0 "Reject it and keep up the pressure."
 pww_coer.3.t:0 "[FROM.GetName] Is Cornered"
 pww_coer.3.d:0 "[pww_coer_loc_cornered]\n\nWorking for us: [pww_coer_loc_for_0]\nHolding out: [pww_coer_loc_hold_0]"
 pww_coer.3.a:0 "Hold firm."
 pww_coer.3.b:0 "Offer a temporary arrangement."
 pww_coer.3.c:0 "Take less."
 pww_coer.4.t:0 "Our Pressure on [FROM.GetName] Is Public"
 pww_coer.4.d:0 "Foreign correspondents have reported our pressure on [FROM.GetCapitalName]. What began as a private approach is now a public ultimatum, and our credibility is at stake."
 pww_coer.4.a:0 "So be it."
 pww_coer.5.t:0 "The Demand on [FROM.GetName]"
 pww_coer.5.d_fold:0 "[FROM.GetCapitalName] has accepted our terms. The agreement is in the ledger and our forces may stand down."
 pww_coer.5.d_lapse:0 "The decision date passed without an answer from [FROM.GetCapitalName], and the demand has lapsed. If we let it rest, every capital will notice."
 pww_coer.5.d_war:0 "[FROM.GetName] has concluded that it must fight rather than submit. Its general staff now holds a war plan against us."
 pww_coer.5.a:0 "Noted."
 pww_coer.6.t:0 "The Demand from [FROM.GetName]"
 pww_coer.6.d_fold:0 "We have conceded to [FROM.GetName]. The terms are now binding."
 pww_coer.6.d_lapse:0 "The decision date has passed and we did not yield. [FROM.GetName] must now decide whether to follow through."
 pww_coer.6.d_war:0 "Cornered and out of options, our cabinet has drawn up plans for war against [FROM.GetName]."
 pww_coer.6.a:0 "Noted."
 pww_coer.7.t:0 "[FROM.GetName] Asks Us to Join an Embargo"
 pww_coer.7.d:0 "[FROM.GetName] asks us to embargo [pww_coer_ev_tg.GetName] within thirty days. A refusal will be noticed in [FROM.GetCapitalName]."
 pww_coer.7.a:0 "Join the embargo."
 pww_coer.7.b:0 "Decline."
 pww_coer.8.t:0 "Strangled by [FROM.GetName]"
 pww_coer.8.d:0 "Months of interdiction by [FROM.GetName] have starved our ports. The cabinet now considers itself justified in answering with force, should it choose to."
 pww_coer.8.a:0 "We will remember this."
