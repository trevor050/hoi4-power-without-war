l_english:
 # Power Without War: diplomacy lane (actions, GUIs, lots, fig leaves). Source: docs/content/wolfram_question.md sections 2 to 5, plus lane UI text.
 pww_act_propose_agreement_title:0 "Propose Commercial Agreement"
 pww_act_propose_agreement_desc:0 "Open formal talks for a supply contract in civilian factories, equipment tranches, or clearing credit. Non-committal flows can end at any time; fixed terms run up to five years."
 pww_act_propose_agreement_wolfram_hint:0 "Offer Salazar clearing credit redeemable in German arms, or civilian works, in exchange for steady wolfram deliveries."
 pww_act_lease_rights_title:0 "Negotiate Resource Lease"
 pww_act_lease_rights_desc:0 "Seek a timed named-state concession (up to five years) granting direct resource rights. Prestigious and visible on the map, but carries nationalization risk and stirs rivals."
 pww_act_lease_rights_wolfram_hint:0 "Direct rights over the Beira Baixa and Tagus districts will feed our mills directly, though Lisbon guards its sovereignty jealously."
 pww_act_demand_quiet_title:0 "Issue Demand (Back Channel)"
 pww_act_demand_quiet_desc:0 "Deliver a private demand with a fixed decision date. Lower ceiling than an ultimatum, but avoids public humiliation and lets authoritarian cabinets bend without losing face. Loud pressure tools will leak this channel to the press."
 pww_act_demand_quiet_wolfram_hint:0 "Salazar can concede quietly through commercial protocols where he would never bow to a public threat."
 pww_act_demand_public_title:0 "Issue Demand (Public Ultimatum)"
 pww_act_demand_public_desc:0 "Put a named demand on the public record with a firm deadline. Higher leverage, but stakes your Credibility, alerts patrons, and rallies democratic publics against you."
 pww_act_demand_public_wolfram_hint:0 "An open ultimatum to Lisbon will bring Whitehall into the room at once. Make sure you can carry it through."
 pww_act_demand_leak_notice:0 "§RChannel leaked:§! Open naval or trade pressure has exposed our private demand to [THIS.GetName]. The dispute is now public."
 pww_act_pledge_support_title:0 "Pledge Commercial Support"
 pww_act_pledge_support_desc:0 "Sign a reserved agreement underwriting this country's output if a coercer cuts them off. Costs nothing unless triggered, but binds real factories or equipment if they call it in."
 pww_act_pledge_support_wolfram_hint:0 "Assure Lisbon that Britain will buy its unsold wolfram if Berlin imposes an embargo or withdraws clearing credit."
 pww_act_quarantine_title:0 "Declare Naval Quarantine"
 pww_act_quarantine_desc:0 "Declare a peacetime naval quarantine on this country. Costs political power upkeep. While your committed ships hold their sea approaches, their exposed sea contracts are suspended and strangulation rises. Lose the approaches and the quarantine lapses."
 pww_act_quarantine_wolfram_hint:0 "Holding the Atlantic approaches off Lisbon will sever maritime deliveries and test whether London's pledge can actually reach port."
 pww_act_demand_settlement_title:0 "Demand Settlement"
 pww_act_demand_settlement_desc:0 "Confront this country over seized concessions. Forces a choice between staged factory compensation, settlement in kind, reversal, or open refusal."
 pww_act_join_embargo_title:0 "Request Embargo Compliance"
 pww_act_join_embargo_desc:0 "Call on this country to join our embargo by a set deadline. Punishing non-compliance raises Credibility at the cost of Reliability."
 pww_rcv_proposal_title:0 "Commercial Proposal from [ROOT.GetName]"
 pww_rcv_proposal_desc:0 "[ROOT.Capital.GetCapitalVictoryPointName] has tabled terms for [pww_diplo_sl_r_res] deliveries. Review the payment bundle, duration, and tranches before answering."
 pww_rcv_lease_title:0 "Concession Request from [ROOT.GetName]"
 pww_rcv_lease_desc:0 "[ROOT.GetName] seeks named-state resource rights over our producing districts. Granting a lease brings heavy returns, though foreign flags on home soil carry political cost."
 pww_rcv_btn_accept:0 "Sign Agreement"
 pww_rcv_btn_counter:0 "Send Counter-Draft"
 pww_rcv_btn_refuse:0 "Decline"
 pww_rcv_demand_quiet_title:0 "Private Demand from [ROOT.GetName]"
 pww_rcv_demand_quiet_desc:0 "Through confidential channels, [ROOT.Capital.GetCapitalVictoryPointName] demands a concession on [pww_diplo_sl_rd_res] output before the decision date. The matter has not yet reached the press."
 pww_rcv_demand_public_title:0 "Public Ultimatum from [ROOT.GetName]"
 pww_rcv_demand_public_desc:0 "[ROOT.GetName] has publicly demanded [pww_diplo_sl_rd_res] output by the decision date. Foreign chanceries are watching how [THIS.Capital.GetCapitalVictoryPointName] answers."
 pww_rcv_move_fold:0 "Accede to Demand"
 pww_rcv_move_fold_desc:0 "Grant [ROOT.GetName]'s terms and close the crisis. Committed forces withdraw once the ink dries."
 pww_rcv_move_small_lot:0 "Offer Smaller Named Lot"
 pww_rcv_move_small_lot_desc:0 "Counter with a partial allocation (such as one district or a reduced output share) to test whether [ROOT.Capital.GetCapitalVictoryPointName] will settle."
 pww_rcv_move_provisional:0 "Propose 90-Day Provisional Suspension"
 pww_rcv_move_provisional_desc:0 "Accept a temporary ninety-day arrangement to buy time, cool the crisis, and seek outside support."
 pww_rcv_move_fig_leaf:0 "Propose Face-Saving Formula"
 pww_rcv_move_fig_leaf_desc:0 "Offer the substance under a joint commission, temporary reversion date, or commercial cover to shield domestic pride."
 pww_rcv_move_call_patron:0 "Appeal to Patron"
 pww_rcv_move_call_patron_desc:0 "Request an urgent commercial backstop or diplomatic intervention from our patrons."
 pww_rcv_move_harden:0 "Harden and Mobilize"
 pww_rcv_move_harden_desc:0 "Reject the pressure publicly, call up reserves, and stake national honor on holding out. Raises resistance and warns [ROOT.GetName] that pushing further risks war."
 pww_rcv_pledge_title:0 "Commercial Backstop from [ROOT.GetName]"
 pww_rcv_pledge_desc:0 "[ROOT.Capital.GetCapitalVictoryPointName] offers to underwrite our unsold output if foreign pressure cuts our markets. Accepting strengthens our hand against coercion."
 pww_rcv_pledge_accept:0 "Accept Underwriting"
 pww_rcv_pledge_decline:0 "Remain Uncommitted"
 pww_rcv_quarantine_title:0 "[ROOT.GetAdjective] Naval Quarantine"
 pww_rcv_quarantine_desc:0 "[ROOT.GetName] has declared a quarantine across our sea approaches. Exposed maritime contracts are suspended while their ships hold the coast."
 pww_rcv_settlement_title:0 "Settlement Demand from [ROOT.GetName]"
 pww_rcv_settlement_desc:0 "[ROOT.Capital.GetCapitalVictoryPointName] demands satisfaction for the seized concessions. Choose how [THIS.Capital.GetCapitalVictoryPointName] will answer."
 pww_rcv_settle_cic:0 "Staged Factory Compensation"
 pww_rcv_settle_cic_desc:0 "Dedicate a share of civilian capacity to [ROOT.GetName] over a fixed term to close the grievance."
 pww_rcv_settle_kind:0 "Settlement in Kind"
 pww_rcv_settle_kind_desc:0 "Deliver output below market or complete a named project for [ROOT.GetName] over the settlement term."
 pww_rcv_settle_reverse:0 "Reverse Nationalization"
 pww_rcv_settle_reverse_desc:0 "Restore the seized rights at a heavy domestic stability and political power cost."
 pww_rcv_settle_refuse:0 "Refuse Compensation"
 pww_rcv_settle_refuse_desc:0 "Stand by the seizure. Escalates the dispute and hands [ROOT.GetName] a war justification."
 pww_rcv_join_embargo_title:0 "Embargo Request from [ROOT.GetName]"
 pww_rcv_join_embargo_desc:0 "[ROOT.Capital.GetCapitalVictoryPointName] asks us to embargo [?pww_de_target.GetName] within the month. Refusal may draw [ROOT.GetAdjective] retaliation."
 pww_rcv_join_embargo_accept:0 "Join the Embargo"
 pww_rcv_join_embargo_refuse:0 "Keep Our Ports Open"
 pww_lot_wolfram_guarda:0 "The Guarda & Panasqueira Lot"
 pww_lot_wolfram_guarda_desc:0 "Interior wolfram concessions centered on Beira Baixa. Rich veins suited to overland or northern dispatch; keeps Lisbon's coastal trade separate."
 pww_lot_wolfram_lisbon:0 "The Lisbon & Tagus Export Lot"
 pww_lot_wolfram_lisbon_desc:0 "Coastal export allocation clearing through the port of Lisbon. Naturally favors the power that commands the Atlantic approaches."
 pww_lot_wolfram_exclusive:0 "Exclusive National Wolfram Lease"
 pww_lot_wolfram_exclusive_desc:0 "All exportable Portuguese tungsten under a single flag for a fixed term. Commands the highest bid, but guarantees fury from the losing capital."
 pww_lot_wolfram_split:0 "The Divided Allocation (Guarda / Lisbon)"
 pww_lot_wolfram_split_desc:0 "Salazar's balancing formula: Guarda to one buyer, Lisbon to the other. Neither power wins a monopoly, and Portugal keeps both at the table."
 pww_lot_wolfram_bridge:0 "Six-Month Bridge Contract"
 pww_lot_wolfram_bridge_desc:0 "A short commercial stopgap with no named-state rights. Buys Lisbon time to watch the European balance before committing the mines."
 pww_auction_header:0 "Lisbon Wolfram Allocation"
 pww_auction_bid_once:0 "Each bidder submits one term bundle per lot. Violating an exclusivity clause opens a breach crisis."
 pww_auction_winner_line:0 "Awarded to [?pww_dd_winner.GetName] under the awarded lot."
 pww_figleaf_token_purchase:0 "Nominal Purchase Supplement"
 pww_figleaf_token_purchase_desc:0 "Add a modest commercial payment so [THIS.Capital.GetCapitalVictoryPointName] can present the concession as an ordinary sale."
 pww_figleaf_joint_commission:0 "Joint Technical Commission"
 pww_figleaf_joint_commission_desc:0 "Place deliveries under a bilateral mining board with equal [THIS.GetAdjective] representation."
 pww_figleaf_sovereignty_note:0 "Public Assurance of Sovereignty"
 pww_figleaf_sovereignty_note_desc:0 "Attach a formal declaration affirming [THIS.GetName]'s full title over its subsoil and ports."
 pww_figleaf_timed_reversion:0 "Fixed Reversion Date"
 pww_figleaf_timed_reversion_desc:0 "Frame the arrangement as strictly temporary, expiring automatically unless renewed by mutual consent. Breaking it early costs Credibility."
 pww_figleaf_clearing_cover:0 "Commercial Clearing Protocol"
 pww_figleaf_clearing_cover_desc:0 "Fold the allocation into a routine bilateral clearing schedule rather than a standalone political protocol."
 pww_figleaf_neutral_transit:0 "Neutral Registry Clause"
 pww_figleaf_neutral_transit_desc:0 "Route shipments under neutral customs paperwork so third capitals have less pretext to protest."
