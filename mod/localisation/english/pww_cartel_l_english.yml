 pww_cartel.1.t: "A Producers' Conference"
 pww_cartel.1.d: "[pww_cartel_chair.GetNameDef] has invited the [pww_cartel_loc_res] producers to confer. Too much [pww_cartel_loc_res] is chasing too few buyers, and every producer is selling below cost to clear its warehouses.\n\nThe proposal: each signatory accepts an export quota, keeps the rest of its output off the market, and sells nothing below an agreed price, [?pww_cartel_ev_pct|0]% above today's rate. The conference sits in 30 days."
 pww_cartel.1.a: "We prefer a free hand."
 pww_cartel.1.b: "We will sign."
 pww_cartel.1.b.tt: "Our [pww_cartel_loc_res] exports are held to a quota once the agreement takes effect. Our deals may not undercut the agreed price."
 pww_cartel.2.t: "The [pww_cartel_loc_res] Agreement Is Signed"
 pww_cartel.2.d: "The conference has done its work. [?pww_cartel_ev_n|0] producers have signed, with [pww_cartel_chair.GetNameDef] in the chair. Each member now sells to its quota and keeps the rest of its [pww_cartel_loc_res] off the market. The agreed price stands [?pww_cartel_ev_pct|0]% above the old rate.\n\nThe arrangement holds only as long as every member trusts the others to keep it."
 pww_cartel.2.a: "Let us hope they keep their word."
 pww_cartel.3.t: "The Conference Breaks Up"
 pww_cartel.3.d: "Our conference of [pww_cartel_loc_res] producers has come to nothing. Too few delegations would put their names to a quota, and the rest prefer to take their chances on the open market. We may try again in time."
 pww_cartel.3.a: "Every man for himself, then."
 pww_cartel.4.t: "A Member Breaks Ranks"
 pww_cartel.4.d: "Our trade attachés report that [pww_cartel_other.GetNameDef] has been selling [pww_cartel_loc_res] outside its quota, or below the agreed price. The committee has issued a formal warning. A second offence will mean expulsion.\n\nThe agreement is now [pww_cartel_loc_coh]."
 pww_cartel.4.a: "Noted."
 pww_cartel.5.t: "The [pww_cartel_loc_res] Agreement Collapses"
 pww_cartel.5.d: "The [pww_cartel_loc_res] agreement has fallen apart. With no quotas left to keep, every producer is racing to sell before the others, and the stocks members held back are pouring onto the market. Prices will be low for months to come."
 pww_cartel.5.a: "Sell while there are buyers."
 pww_cartel.6.t: "Expelled from the Agreement"
 pww_cartel.6.d: "The [pww_cartel_loc_res] committee has voted to expel us for selling outside our quota after a formal warning. Our former partners are furious, and producers elsewhere will think twice before inviting us to the table again.\n\nWe are at least free to sell as we please."
 pww_cartel.6.a: "Their loss."
 pww_cartel.7.t: "A Member Is Expelled"
 pww_cartel.7.d: "After a second offence the committee has expelled [pww_cartel_other.GetNameDef] from the [pww_cartel_loc_res] agreement. [?pww_cartel_ev_n|0] members remain, and the agreement is [pww_cartel_loc_coh]."
 pww_cartel.7.a: "Good riddance."
 pww_cartel.8.t: "The Committee Has Questions"
 pww_cartel.8.d: "The [pww_cartel_loc_res] committee, chaired by [pww_cartel_chair.GetNameDef], has formally warned us. It has learned of our sales outside the quota or below the agreed price, and it will expel us if it happens again.\n\nWe are allowed [?pww_cartel_ev_quota|0] a day through our own contracts and are selling [?pww_cartel_ev_sold|0]."
 pww_cartel.8.a: "Deny everything."
 pww_cartel.8.a.tt: "The contracts stand. Suspicion stays high, and the next discovery means expulsion."
 pww_cartel.8.b: "End the side contracts."
 pww_cartel.8.b.tt: "Our open-ended contracts signed since we joined that break the rules are cancelled. Fixed-term contracts must run their course. Suspicion falls."
 pww_cartel.9.t: "An Offer from [pww_cartel_other.GetName]"
 pww_cartel.9.d: "[pww_cartel_other.GetNameDef] proposes a year's contract for [?pww_cartel_ev_amt|0] [pww_cartel_loc_res] a day, paid with [?pww_cartel_ev_civ|0] civilian factories, well above the agreed price. The condition is plain: we must leave the [pww_cartel_loc_res] agreement."
 pww_cartel.9.a: "We keep faith with our partners."
 pww_cartel.9.b: "Accept the contract."
 pww_cartel.9.b.tt: "We leave the agreement and sign a one-year contract with [pww_cartel_other.GetNameDef]. The remaining members will resent it."
 pww_cartel.10.t: "[pww_cartel_other.GetName] Takes Our Offer"
 pww_cartel.10.d: "[pww_cartel_other.GetNameDef] has signed our contract and left the [pww_cartel_loc_res] agreement. Its former partners are bitter, and the agreement is now [pww_cartel_loc_coh]."
 pww_cartel.10.a: "Business is business."
 pww_cartel.11.t: "[pww_cartel_other.GetName] Declines"
 pww_cartel.11.d: "[pww_cartel_other.GetNameDef] has turned down our contract and stays in the [pww_cartel_loc_res] agreement. Still, the approach has been noticed, and its partners will wonder what else it has been offered."
 pww_cartel.11.a: "There will be other offers."
